<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Ops Dashboard 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .active-tab { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

<nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold flex items-center gap-2"><i data-lucide="package"></i> Logistics Ops 2026</h1>
    <div id="date-display" class="text-sm opacity-75">Junio 2026</div>
</nav>

<div class="p-6">
    <!-- Tabs -->
    <div class="flex gap-6 border-b border-slate-200 mb-6">
        <button onclick="switchTab('forecast')" class="pb-2 font-medium flex items-center gap-2 hover:text-blue-500 transition"><i data-lucide="trending-up"></i> Forecast</button>
        <button onclick="switchTab('dotacion')" class="pb-2 font-medium flex items-center gap-2 hover:text-blue-500 transition"><i data-lucide="users"></i> Dotación Ideal</button>
        <button onclick="switchTab('historico')" class="pb-2 font-medium flex items-center gap-2 hover:text-blue-500 transition"><i data-lucide="history"></i> Histórico</button>
    </div>

    <!-- Contenido -->
    <div id="content" class="min-h-[500px]">
        <!-- Aquí se renderizarán los componentes dinámicamente -->
        <div id="view-forecast" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="stats-container"></div>
            <div class="card p-4"><canvas id="chartMain" height="300"></canvas></div>
        </div>
    </div>
</div>

<script>
    // Inicialización de iconos
    lucide.createIcons();

    // Estado básico del sistema
    const state = {
        targetGGP: 41,
        data: Array.from({length: 30}, (_, i) => ({
            day: i + 1,
            vol: Math.floor(Math.random() * 5000) + 10000,
            ggp: 40 + Math.random() * 5
        }))
    };

    function switchTab(tab) {
        const container = document.getElementById('content');
        if(tab === 'dotacion') {
            renderDotacionIdeal();
        } else {
            container.innerHTML = `<div class="card p-6"><h2>Módulo ${tab.toUpperCase()} en construcción...</h2></div>`;
        }
    }

    function renderDotacionIdeal() {
        const html = `
            <div class="card p-6">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="calculator"></i> Calculadora Dotación Ideal</h2>
                <table class="w-full text-left">
                    <thead class="bg-slate-100"><tr><th class="p-3">Día</th><th class="p-3">Volumen Proy.</th><th class="p-3">Dotación (GGP ${state.targetGGP})</th></tr></thead>
                    <tbody>
                        ${state.data.map(d => `
                            <tr class="border-b">
                                <td class="p-3">${d.day}/06</td>
                                <td class="p-3 font-mono">${d.vol.toLocaleString()}</td>
                                <td class="p-3 font-bold text-blue-600">${Math.round(d.vol / state.targetGGP)} pax</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
        document.getElementById('content').innerHTML = html;
        lucide.createIcons();
    }

    // Inicialización visual
    switchTab('forecast');
</script>
</body>
</html>
